		<script type="text/javascript" src="js/jquery.gridrotator.js"></script>
		<script type="text/javascript">	
			
			function setup(){
			
			$(function() {
			
				$( '#ri-grid' ).gridrotator( {
					rows : 3,
					columns : 6,
					maxStep : 2,
					interval : 2000,
					w1024 : {
						rows : 5,
						columns : 6
					},
					w768 : {
						rows : 5,
						columns : 5
					},
					w480 : {
						rows : 6,
						columns : 4
					},
					w320 : {
						rows : 7,
						columns : 4
					},
					w240 : {
						rows : 7,
						columns : 3
					},
				} );
			
			});
			
			}
		</script>
		
		
<script>
function addphoto(){
//var img = api.OpenFile();
var img = "";
var ss = String(api.GetFiles("*.png *.jpg *.gif"));
if(ss != "") {
var Photos = ss.split(",");
for(i=0; i < Photos.length; i++){
img = Photos[i].replace(new RegExp(/\\/g),"/");
var  rr = Math.floor((Math.random()*1000)+i);
$('#mgm').append('<li id="'+rr+'"><a href="file:///'+img+'"><img src="file:///'+img+'" /></a></li>');
}
setup();
}
}



$(document).ready(function() {
setup();
$("li").live("click", function(){ 

 });  
});
</script>
